<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Login - University Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
  <div class="row g-0 vh-100">
    <div class="col-md-6 d-none d-md-block" style="background-image: url('https://images.unsplash.com/photo-1523240795612-9a054b0db644?q=80&w=800&auto=format&fit=crop');
                    background-size: cover;
                    background-position: center;">
    </div>

    <div class="col-md-6 d-flex align-items-center justify-content-center bg-light">
      <div class="p-5" style="width: 100%; max-width: 400px;">
        <h2 class="fw-bold mb-1">Welcome Back</h2>
        <p class="text-muted mb-4">Sign in to your University Portal account</p>

        <form method="POST" action="/login">
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" placeholder="you@university.edu" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2">Sign In</button>
        </form>
      </div>
    </div>
  </div>
</body>

</html>
